<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">游戏写实影像 PHOTO-REAL VIRTUALITY — 艾尔登法环、赛博朋克 2077 与塞尔达的摄影风格 AI 画册</title>
  <desc id="desc">暖黑底胶片画册风标题：游戏写实影像；右侧是三条 35mm 胶片，分别画着黄金树、霓虹夜之城与海拉鲁原野，代表三个游戏世界。</desc>

  <rect width="1200" height="360" rx="26" fill="#171310"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#b8a88a">AI 摄影风格画册 · PHOTOGRAPHY-STYLE AI GALLERY</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8c97a">游戏写实影像</text>
    <text x="56" y="168" font-size="23" fill="#efe8da">PHOTO-REAL VIRTUALITY — 游戏角色与场景的写实转译</text>
    <text x="56" y="204" font-size="19" fill="#b8a88a">艾尔登法环、赛博朋克 2077、塞尔达传说，三部作品共 67 幅。</text>
    <g id="chips" font-size="18" fill="#efe8da" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#2a211a" stroke="#4a3a28" stroke-width="1.5"/><text x="119" y="262">67 幅作品</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#2a211a" stroke="#4a3a28" stroke-width="1.5"/><text x="269" y="262">3 个游戏世界</text></g>
      <g><rect x="356" y="238" width="150" height="36" rx="18" fill="#2a211a" stroke="#4a3a28" stroke-width="1.5"/><text x="431" y="262">v1 / v2 对照</text></g>
      <g><rect x="518" y="238" width="126" height="36" rx="18" fill="#2a211a" stroke="#4a3a28" stroke-width="1.5"/><text x="581" y="262">键盘浏览</text></g>
    </g>
  </g>

