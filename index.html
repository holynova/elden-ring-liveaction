<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELDEN RING · 艾尔登法环 纯相机实拍与活人感摄影典藏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ─── Global Reset & Design Tokens ─── */
    :root {
      --bg-black: #060608;
      --bg-surface: #0e0e13;
      --bg-elevated: #15151c;
      --gold-primary: #c9aa71;
      --gold-bright: #e7ca94;
      --gold-dark: #8c734b;
      --gold-glow: rgba(201, 170, 113, 0.25);
      --text-main: #ece7de;
      --text-dim: #9c9486;
      --border-subtle: rgba(201, 170, 113, 0.15);
      --border-card: #232228;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-display: 'Cinzel', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: 'Space Grotesk', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── Prototype Stage Harness ─── */
    #stage {
      min-height: 100vh;
      padding-bottom: 90px; /* Room for floating picker */
    }

    /* ─── VERBATIM PICKER STYLES (from Emil Kowalski PICKER.md) ─── */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    /* ─── VARIANT 1: EDITORIAL (MUSEUM EXHIBITION) STYLES ─── */
    .v-editorial {
      max-width: 1360px;
      margin: 0 auto;
      padding: 60px 24px 100px;
      animation: fadeIn 220ms var(--ease-out);
    }

    .v-editorial .hero {
      text-align: center;
      margin-bottom: 70px;
      position: relative;
    }

    .v-editorial .hero-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold-bright);
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(201, 170, 113, 0.1);
      border: 1px solid var(--border-subtle);
      margin-bottom: 16px;
    }

    .v-editorial .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      color: var(--gold-bright);
      letter-spacing: 2px;
      line-height: 1.15;
      margin-bottom: 16px;
      text-shadow: 0 0 35px var(--gold-glow);
    }

    .v-editorial .hero-sub {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text-dim);
      max-width: 760px;
      margin: 0 auto;
    }

    .v-editorial .exhibit-grid {
      display: flex;
      flex-direction: column;
      gap: 100px;
    }

    .v-editorial .exhibit-item {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
    }

    .v-editorial .exhibit-item:nth-child(even) {
      grid-template-columns: 0.85fr 1.15fr;
    }
    .v-editorial .exhibit-item:nth-child(even) .exhibit-media {
      order: 2;
    }
    .v-editorial .exhibit-item:nth-child(even) .exhibit-info {
      order: 1;
    }

    @media (max-width: 960px) {
      .v-editorial .exhibit-item,
      .v-editorial .exhibit-item:nth-child(even) {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .v-editorial .exhibit-item:nth-child(even) .exhibit-media { order: 1; }
      .v-editorial .exhibit-item:nth-child(even) .exhibit-info { order: 2; }
    }

    .v-editorial .exhibit-media {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      background: #000;
      border: 1px solid var(--border-card);
      cursor: zoom-in;
    }

    .v-editorial .exhibit-media img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 300ms var(--ease-out);
    }

    .v-editorial .exhibit-media:hover img {
      transform: scale(1.025);
    }

    .v-editorial .exhibit-plate {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #dfd7cc;
      backdrop-filter: blur(8px);
    }

    .v-editorial .exhibit-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .v-editorial .exhibit-num {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--gold-dark);
      letter-spacing: 2px;
    }

    .v-editorial .exhibit-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .v-editorial .exhibit-meta-line {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--gold-primary);
      display: flex;
      gap: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .v-editorial .exhibit-desc {
      color: #b8b0a4;
      font-size: 1rem;
      line-height: 1.7;
    }

    .v-editorial .exhibit-quote {
      border-left: 2px solid var(--gold-primary);
      padding-left: 14px;
      font-family: var(--font-serif);
      font-style: italic;
      color: #928b80;
      font-size: 0.95rem;
    }

    /* ─── VARIANT 2: FILMSTRIP (DARKROOM CINEMA) STYLES ─── */
    .v-filmstrip {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background: #040405;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 90px;
      animation: fadeIn 220ms var(--ease-out);
    }

    .v-filmstrip .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px 24px;
    }

    .v-filmstrip .brand {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .v-filmstrip .hud-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #888;
    }

    .v-filmstrip .strip-container {
      display: flex;
      gap: 32px;
      overflow-x: auto;
      padding: 20px 40px 40px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .v-filmstrip .film-card {
      flex: 0 0 540px;
      scroll-snap-align: center;
      background: #0b0b0e;
      border: 1px solid #1f1f26;
      border-radius: 6px;
      position: relative;
      padding: 20px 16px 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (max-width: 640px) {
      .v-filmstrip .film-card { flex: 0 0 85vw; }
    }

    /* 35mm film perforations */
    .v-filmstrip .perforations {
      height: 8px;
      background-image: radial-gradient(circle, #2a2a34 3px, transparent 3px);
      background-size: 18px 8px;
      opacity: 0.6;
    }

    .v-filmstrip .film-frame {
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 4px;
      background: #000;
      position: relative;
      cursor: zoom-in;
    }

    .v-filmstrip .film-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 250ms var(--ease-out);
    }
    .v-filmstrip .film-frame:hover img {
      transform: scale(1.04);
    }

    .v-filmstrip .film-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .v-filmstrip .film-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .v-filmstrip .film-exp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--gold-primary);
    }

    .v-filmstrip .film-exif {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #777;
      display: flex;
      gap: 12px;
    }

    .v-filmstrip .film-desc {
      font-size: 0.86rem;
      color: #9e978b;
      line-height: 1.5;
    }

    /* ─── VARIANT 3: ARCHIVE (STUDIO INSPECTOR) STYLES ─── */
    .v-archive {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 24px 100px;
      animation: fadeIn 220ms var(--ease-out);
    }

    .v-archive .archive-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-card);
    }

    .v-archive .archive-title {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold-bright);
      letter-spacing: -0.5px;
    }

    .v-archive .filter-group {
      display: flex;
      gap: 8px;
      background: var(--bg-surface);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
    }

    .v-archive .filter-btn {
      background: transparent;
      border: 0;
      color: #888;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 150ms ease-out;
    }

    .v-archive .filter-btn:hover { color: #fff; }
    .v-archive .filter-btn.active {
      background: var(--bg-elevated);
      color: var(--gold-bright);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .v-archive .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .v-archive .archive-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 200ms ease-out, transform 200ms ease-out;
    }

    .v-archive .archive-card:hover {
      border-color: var(--gold-dark);
      transform: translateY(-2px);
    }

    .v-archive .split-slider-container {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      background: #000;
      user-select: none;
    }

    .v-archive .split-slider-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .v-archive .split-img-after {
      z-index: 2;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .v-archive .split-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: var(--gold-bright);
      z-index: 3;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    .v-archive .split-handle::after {
      content: '↔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: #0a0a0c;
      border: 1px solid var(--gold-primary);
      border-radius: 50%;
      color: var(--gold-bright);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .v-archive .archive-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .v-archive .archive-card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
    }

    .v-archive .archive-card-exif {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--gold-primary);
      display: flex;
      justify-content: space-between;
    }

    .v-archive .archive-card-desc {
      font-size: 0.85rem;
      color: #928b80;
      line-height: 1.5;
    }

    /* ─── LIGHTBOX MODAL ─── */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2147483646;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
    }
    .lightbox-modal img {
      max-width: 92vw;
      max-height: 90vh;
      border-radius: 6px;
      border: 1px solid var(--gold-dark);
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      return `
        <div class="v-archive">

          <div class="archive-grid" id="archiveGrid">
            ${ITEMS.map(item => `
              <div class="archive-card" data-cat="${item.cat}">
                <div class="split-slider-container" onmousemove="handleSplitHover(event, this)" onclick="openLightbox('${item.src}')">

                  <img src="${item.src}" alt="${item.name} 实拍" class="split-img-after">

                </div>

                  <div class="archive-card-title">${item.name}</div>
                  <div class="archive-card-exif">

                </div>
              </div>
            `).join('')}

        </div>
      `;

    /* ─── INTERACTION HELPERS ─── */
    function handleSplitHover(e, container) {
      const rect = container.getBoundingClientRect();
      const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const pct = (x / rect.width) * 100;
      const afterImg = container.querySelector('.split-img-after');
      const handle = container.querySelector('.split-handle');
      if (afterImg) afterImg.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
      if (handle) handle.style.left = `${pct}%`;
    }

    function filterArchive(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.archive-card').forEach(card => {
        if (cat === 'all' || card.getAttribute('data-cat') === cat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    /* ─── PROTOTYPE HARNESS WIRING (from Emil Kowalski PICKER.md) ─── */
    const variants = [renderEditorial, renderFilmstrip, renderArchive];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
      else if (e.key === 'Escape') closeLightbox();
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
